[package]
name = "wasm"
version = "0.1.0"
description = "A sample project with wasm-pack"
edition = "2024"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3.78"
reqwest = "0.12.19"
serde = { version = "1.0.219", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.140"
wasm-bindgen = "0.2.102"
wasm-bindgen-futures = "0.4.51"
web-sys = { version = "0.3.78", features = ['console', 'Headers', 'Request', 'RequestInit', 'RequestMode', 'Response', 'Window'] }
web-time = "1.1.0"
