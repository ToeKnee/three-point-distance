[package]
name = "wasm"
version = "0.1.0"
description = "A sample project with wasm-pack"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
reqwest = "0.12.19"
serde = { version = "1.0.219", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.140"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.50"
web-sys = { version = "0.3.77", features = ['console'] }
web-time = "1.1.0"
